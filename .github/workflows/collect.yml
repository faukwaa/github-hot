name: Auto Collect

on:
  schedule:
    # 每天 UTC 01:30（北京时间 09:30）自动采集
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 data 分支（云端数据库）
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 1

      - name: 获取 main 分支源码（仅用于安装，不提交到 data 分支）
        run: |
          curl -sL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/heads/main.tar.gz" | tar xz --strip-components=1

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 github-hot
        run: pip install -e .

      - name: 采集（AI 任务总结 + 仓库一句话简介）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: github-hot-cli collect

      - name: 提交并推送数据库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/github_hot.db
          if git diff --staged --quiet; then
            echo "数据库无变化，跳过提交"
          else
            git commit -m "chore(data): 自动采集 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
